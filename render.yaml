services:
  - type: web
    name: leadpulse-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NUBELA_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://lead.codernest.cloud
